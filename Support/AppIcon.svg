<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Music Player icon (Ember)</title>
  <!-- "Ember": a white note over a blurred field of red, orange and near-black on Apple's 824 px
       tile in a 1024 px canvas. The tile clip path is in canvas coordinates, outside the
       translate, because scripts/icon-mask.swift reads it to cut Quick Look's white square
       away; that cut also takes the tile's drop shadow, which Quick Look draws on white. -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="23" flood-color="#78140A" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2A0404" flood-opacity="0.38"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100)">
    <rect x="0" y="0" width="824" height="824" rx="185" fill="#D22A1E" filter="url(#tileShadow)"/>
  </g>
  <g clip-path="url(#tile)">
    <g transform="translate(100 100)">
      <g filter="url(#frost)">
        <rect x="-200" y="-200" width="1224" height="1224" fill="#D22A1E"/>
        <circle cx="215" cy="170" r="315" fill="#6E0A12"/>
        <circle cx="640" cy="170" r="325" fill="#FF7A1A"/>
        <circle cx="185" cy="650" r="325" fill="#FF3B2F"/>
        <circle cx="675" cy="730" r="325" fill="#3A0508"/>
      </g>
      <rect x="0" y="0" width="824" height="824" fill="url(#sheen)"/>
      <g opacity="0.92" fill="#FFFFFF" filter="url(#lift)" transform="translate(412 412) scale(1.12) translate(-412 -412)">
        <circle cx="277" cy="583" r="88"/>
        <circle cx="547" cy="543" r="88"/>
        <rect x="320" y="233" width="45" height="350"/>
        <rect x="590" y="193" width="45" height="350"/>
        <polygon points="320,193 635,153 635,233 320,273"/>
      </g>
      <rect x="2" y="2" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
    </g>
  </g>
</svg>
