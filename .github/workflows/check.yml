name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's macOS images install each Xcode as /Applications/Xcode_<version>.app.
      # The version comes from .xcode-version so it is written down once.
      - run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - run: ./scripts/setup
      - run: ./scripts/check
